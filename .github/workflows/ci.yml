name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This compiles the Swift product and runs the native, shell, and guest
      # contract suites. The guest image itself is built in a Guix System
      # builder (guest/guix/README.md), not on GitHub-hosted runners.
      - name: Run test suite
        run: make test

      - name: Install runtime build tool
        run: command -v pkg-config || brew install pkg-config

      # Build the actual graphics stack and QEMU on both supported OS families.
      # Includes VirGL shader regressions and the complete binary compatibility audit.
      - name: Build and verify native runtime
        run: make runtime
