# Roguix substitutes: guix publish on 127.0.0.1:8181.
server {
    server_name roguix.frolow.dev;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        # Nars are large and served from guix publish's cache.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/roguix.frolow.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roguix.frolow.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = roguix.frolow.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name roguix.frolow.dev;
    return 404; # managed by Certbot


}